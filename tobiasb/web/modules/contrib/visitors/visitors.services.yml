services:
  visitors.negotiator:
    class: Drupal\visitors\Theme\VisitorThemeNegotiator
    arguments:
      - '@config.factory'
      - '@current_user'
    tags:
      - { name: theme_negotiator, priority: -50 }

  visitors.tracker:
    class: Drupal\visitors\Service\TrackerService
    arguments:
      - '@database'

  visitors.visibility:
    class: Drupal\visitors\Service\VisibilityService
    arguments:
      - '@config.factory'
      - '@path.current'
      - '@?path_alias.manager'
      - '@path.matcher'
      - '@user.data'
      - '@request_stack'
      - '@current_user'

  visitors.report:
    class: Drupal\visitors\Service\ReportService
    arguments:
      - '@database'
      - '@config.factory'
      - '@request_stack'
      - '@renderer'
      - '@date.formatter'
      - '@entity_type.manager'
      - '@module_handler'
      - '@visitors.date_range'

  visitors.counter:
    class: Drupal\visitors\Service\CounterService
    arguments:
      - '@database'
      - '@datetime.time'
      - '@state'

  visitors.rebuild.route:
    class: Drupal\visitors\Service\RebuildRouteService
    arguments:
      - '@database'
      - '@router.no_access_checks'
      - '@logger.channel.visitors'

  visitors.rebuild.ip_address:
    class: Drupal\visitors\Service\RebuildIpAddressService
    arguments:
      - '@database'
      - '@logger.channel.visitors'

  visitors.cookie:
    class: Drupal\visitors\Service\CookieService
    arguments:
      - '@request_stack'

  visitors.device:
    class: Drupal\visitors\Service\DeviceService
    arguments:
      - '@database'

  logger.channel.visitors:
    parent: logger.channel_base
    arguments: ['visitors']

  visitors.location:
    class: Drupal\visitors\Service\LocationService
    arguments:
      - '@string_translation'

  visitors.language:
    class: Drupal\visitors\Service\LanguageService
    arguments:
      - '@string_translation'

  visitors.date_range:
    class: Drupal\visitors\Service\DateRangeService
    arguments:
      - '@date.formatter'
      - '@request_stack'
      - '@config.factory'

  visitors.online:
    class: Drupal\visitors\Service\OnlineService
    arguments:
      - '@database'
      - '@datetime.time'

  visitors.cron:
    class: Drupal\visitors\Service\CronService
    arguments:
      - '@config.factory'
      - '@database'
      - '@state'
      - '@datetime.time'
      - '@visitors.counter'

  visitors.page_attachments:
    class: Drupal\visitors\Service\PageAttachmentsService
    arguments:
      - '@config.factory'
      - '@current_user'
      - '@module_handler'
      - '@current_route_match'
      - '@request_stack'
      - '@visitors.visibility'
      - '@logger.channel.visitors'

  cache_context.visitors_date_range:
    class: Drupal\visitors\Cache\DateRangeCacheContext
    arguments:
      - '@visitors.date_range'
      - '@datetime.time'
    tags:
      - { name: cache.context, context_id: visitors.date_range }

  Drupal\visitors\Hook\CounterHooks:
    class: Drupal\visitors\Hook\CounterHooks
    autowire: true
  Drupal\visitors\Hook\CronHooks:
    class: Drupal\visitors\Hook\CronHooks
    autowire: true
  Drupal\visitors\Hook\HelpHooks:
    class: Drupal\visitors\Hook\HelpHooks
    autowire: true
  Drupal\visitors\Hook\PageAttachmentsHooks:
    class: Drupal\visitors\Hook\PageAttachmentsHooks
    autowire: true
  Drupal\visitors\Hook\SearchHooks:
    class: Drupal\visitors\Hook\SearchHooks
    arguments:
      - '@config.factory'
      - '@state'
  Drupal\visitors\Hook\TokenHooks:
    class: Drupal\visitors\Hook\TokenHooks
    arguments:
      - '@config.factory'
      - '@token'
      - '@visitors.counter'
      - '@date.formatter'
  Drupal\visitors\Hook\UserHooks:
    class: Drupal\visitors\Hook\UserHooks
    arguments:
      - '@config.factory'
      - '@user.data'
  Drupal\visitors\Hook\ViewsHooks:
    class: Drupal\visitors\Hook\ViewsHooks
    arguments:
      - '@config.factory'
      - '@entity_type.manager'
